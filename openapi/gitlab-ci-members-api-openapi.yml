          default: 20
      responses:
        '200':
          description: "Gets a list of group or project members viewable by the authenticated user,\n          excluding those with inherited membership from ancestor groups."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/API_Entities_Member'
      tags:
      - members
      operationId: getApiV4ProjectsIdMembers
    post:
      description: Adds a member to a group or project.
      parameters:
      - in: path
        name: id
        description: The project ID
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Adds a member to a group or project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Member'
      tags:
      - members
      operationId: postApiV4ProjectsIdMembers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiV4ProjectsIdMembers'
        required: true
  /api/v4/projects/{id}/members/all:
    get:
      description: "Gets a list of group or project members viewable by the authenticated user,\n          including those with inherited membership from ancestor groups."
      parameters:
      - in: path
        name: id
        description: The project ID
        required: true
        schema:
          type: string
      - in: query
        name: query
        description: A query string to search for members
        required: false
        schema:
          type: string
      - in: query
        name: user_ids
        description: Array of user ids to look up for membership
        required: false
        schema:
