openapi: 3.2.0
info:
  title: GitLab access_requests Members API
  version: v4
  description: Operations related to access requests
servers:
- url: https://gitlab.com
tags:
- name: members
  description: Operations about members
paths:
  /api/v4/groups/{id}/members:
    get:
      description: "Gets a list of group or project members viewable by the authenticated user,\n          excluding those with inherited membership from ancestor groups."
      parameters:
      - in: path
        name: id
        description: The group ID
        required: true
        schema:
          type: string
      - in: query
        name: query
        description: A query string to search for members
        required: false
        schema:
          type: string
      - in: query
        name: user_ids
        description: Array of user ids to look up for membership
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: skip_users
        description: Array of user ids to be skipped for membership
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: show_seat_info
        description: Show seat information for members
        required: false
        schema:
          type: boolean
      - in: query
        name: with_saml_identity
        description: List only members with linked SAML identity
        required: false
        schema:
          type: boolean
      - in: query
        name: page
        description: Current page number
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of items per page
        required: false
        example: 20
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: "Gets a list of group or project members viewable by the authenticated user,\n          excluding those with inherited membership from ancestor groups."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/API_Entities_Member'
      tags:
      - members
      operationId: getApiV4GroupsIdMembers
    post:
      description: Adds a member to a group or project.
      parameters:
      - in: path
        name: id
        description: The group ID
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Adds a member to a group or project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Member'
      tags:
      - members
      operationId: postApiV4GroupsIdMembers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiV4GroupsIdMembers'
        required: true
  /api/v4/groups/{id}/members/all:
    get:
      description: "Gets a list of group or project members viewable by the authenticated user,\n          including those with inherited membership from ancestor groups."
      parameters:
      - in: path
        name: id
        description: The group ID
        required: true
        schema:
          type: string
      - in: query
        name: query
        description: A query string to search for members
        required: false
        schema:
          type: string
      - in: query
        name: user_ids
        description: Array of user ids to look up for membership
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: show_seat_info
        description: Show seat information for members
        required: false
        schema:
          type: boolean
      - in: query
        name: state
        description: Filter results by member state
        required: false
        schema:
          type: string
          enum:
          - awaiting
          - active
      - in: query
        name: page
        description: Current page number
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of items per page
        required: false
        example: 20
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: "Gets a list of group or project members viewable by the authenticated user,\n          including those with inherited membership from ancestor groups."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/API_Entities_Member'
      tags:
      - members
      operationId: getApiV4GroupsIdMembersAll
  /api/v4/groups/{id}/members/{user_id}:
    get:
      description: Gets a member of a group or project.
      parameters:
      - in: path
        name: id
        description: The group ID
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: The user ID of the member
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Gets a member of a group or project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Member'
      tags:
      - members
      operationId: getApiV4GroupsIdMembersUserId
    put:
      description: Updates a member of a group or project.
      parameters:
      - in: path
        name: id
        description: The group ID
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: The user ID of the new member
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Updates a member of a group or project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Member'
      tags:
      - members
      operationId: putApiV4GroupsIdMembersUserId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putApiV4GroupsIdMembersUserId'
        required: true
    delete:
      description: Removes a user from a group or project.
      parameters:
      - in: path
        name: id
        description: The group ID
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: The user ID of the member
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: skip_subresources
        description: Flag indicating if the deletion of direct memberships of the removed member in subgroups and projects should be skipped
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: unassign_issuables
        description: Flag indicating if the removed member should be unassigned from any issues or merge requests within given group or project
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '204':
          description: Removes a user from a group or project.
      tags:
      - members
      operationId: deleteApiV4GroupsIdMembersUserId
  /api/v4/groups/{id}/members/all/{user_id}:
    get:
      description: Gets a member of a group or project, including those who gained membership through ancestor group
      parameters:
      - in: path
        name: id
        description: The group ID
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: The user ID of the member
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Gets a member of a group or project, including those who gained membership through ancestor group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Member'
      tags:
      - members
      operationId: getApiV4GroupsIdMembersAllUserId
  /api/v4/groups/{id}/members/{user_id}/override:
    post:
      description: Overrides the access level of an LDAP group member.
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: The user ID of the member
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '201':
          description: Overrides the access level of an LDAP group member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Member'
      tags:
      - members
      operationId: postApiV4GroupsIdMembersUserIdOverride
    delete:
      description: Remove an LDAP group member access level override.
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: The user ID of the member
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Remove an LDAP group member access level override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Member'
      tags:
      - members
      operationId: deleteApiV4GroupsIdMembersUserIdOverride
  /api/v4/groups/{id}/members/{member_id}/approve:
    put:
      description: Approves a pending member
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      - in: path
        name: member_id
        description: The ID of the member requiring approval
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Approves a pending member
      tags:
      - members
      operationId: putApiV4GroupsIdMembersMemberIdApprove
  /api/v4/groups/{id}/members/approve_all:
    post:
      description: Approves all pending members
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Approves all pending members
      tags:
      - members
      operationId: postApiV4GroupsIdMembersApproveAll
  /api/v4/groups/{id}/pending_members:
    get:
      description: Lists all pending members for a group including invited users
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      - in: query
        name: page
        description: Current page number
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of items per page
        required: false
        example: 20
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: Lists all pending members for a group including invited users
      tags:
      - members
      operationId: getApiV4GroupsIdPendingMembers
  /api/v4/groups/{id}/members/{user_id}/state:
    put:
      description: Changes the state of the memberships of a user in the group
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: The user ID of the user
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Changes the state of the memberships of a user in the group
      tags:
      - members
      operationId: putApiV4GroupsIdMembersUserIdState
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putApiV4GroupsIdMembersUserIdState'
        required: true
  /api/v4/groups/{id}/billable_members/{user_id}/memberships:
    get:
      description: Get the direct memberships of a billable user of a top-level group.
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: The user ID of the member
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: page
        description: Current page number
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of items per page
        required: false
        example: 20
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: Get the direct memberships of a billable user of a top-level group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_BillableMembership'
      tags:
      - members
      operationId: getApiV4GroupsIdBillableMembersUserIdMemberships
  /api/v4/groups/{id}/billable_members/{user_id}/indirect:
    get:
      description: Get the indirect memberships of a billable user of a top-level group.
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: The user ID of the member
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: page
        description: Current page number
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of items per page
        required: false
        example: 20
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: Get the indirect memberships of a billable user of a top-level group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_BillableMembership'
      tags:
      - members
      operationId: getApiV4GroupsIdBillableMembersUserIdIndirect
  /api/v4/groups/{id}/billable_members/{user_id}:
    delete:
      description: Removes a billable member from a group or project.
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        description: The user ID of the member
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: Removes a billable member from a group or project.
      tags:
      - members
      operationId: deleteApiV4GroupsIdBillableMembersUserId
  /api/v4/projects/{id}/members:
    get:
      description: "Gets a list of group or project members viewable by the authenticated user,\n          excluding those with inherited membership from ancestor groups."
      parameters:
      - in: path
