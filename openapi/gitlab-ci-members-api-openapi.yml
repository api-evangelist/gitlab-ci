      - in: query
        name: with_saml_identity
        description: List only members with linked SAML identity
        required: false
        schema:
          type: boolean
      - in: query
        name: page
        description: Current page number
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
