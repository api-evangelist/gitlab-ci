components:
  schemas:
    putApiV4ProjectsIdMembersUserId:
      type: object
      properties:
        access_level:
          type: integer
          format: int32
          description: A valid access level
        expires_at:
          type: string
          format: date-time
          description: Date string in the format YEAR-MONTH-DAY
        member_role_id:
          type: integer
          format: int32
          description: The ID of the Member Role to be updated
      required:
      - access_level
      description: Updates a member of a group or project.
    postApiV4GroupsIdMembers:
      type: object
      properties:
        access_level:
          type: integer
          format: int32
          description: A valid access level.
        user_id:
          type: integer
          format: int32
          description: The user ID of the new member or multiple IDs separated by commas.
        username:
          type: string
          description: The username of the new member or multiple usernames separated by commas.
        expires_at:
          type: string
          format: date-time
          description: Date string in the format YEAR-MONTH-DAY
        invite_source:
          type: string
          description: Source that triggered the member creation process
          default: members-api
      required:
      - access_level
      description: Adds a member to a group or project.
    API_Entities_Member:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        username:
          type: string
          example: admin
        public_email:
          type: string
          example: john@example.com
        name:
          type: string
          example: Administrator
        state:
          type: string
          example: active
        locked:
          type: boolean
        avatar_url:
          type: string
          example: https://gravatar.com/avatar/1
        avatar_path:
          type: string
          example: /user/avatar/28/The-Big-Lebowski-400-400.png
        custom_attributes:
          type: array
          items:
            $ref: '#/components/schemas/API_Entities_CustomAttribute'
        web_url:
          type: string
          example: https://gitlab.example.com/root
        access_level:
          type: string
        created_at:
          type: string
        created_by:
          $ref: '#/components/schemas/API_Entities_UserBasic'
        expires_at:
          type: string
        group_saml_identity:
          $ref: '#/components/schemas/API_Entities_Identity'
        group_scim_identity:
          $ref: '#/components/schemas/API_Entities_ScimIdentity'
        email:
          type: string
        is_using_seat:
          type: string
        override:
          type: string
        membership_state:
          type: string
        member_role:
          $ref: '#/components/schemas/API_Entities_MemberRole'
      required:
      - id
      - username
      - public_email
      - name
      - state
      - locked
      - avatar_url
      - web_url
      - access_level
      - created_at
      - expires_at
      - membership_state
      description: API_Entities_Member model
    API_Entities_BillableMembership:
      type: object
      properties:
        id:
          type: string
        source_id:
          type: string
        source_full_name:
          type: string
        source_members_url:
          type: string
        created_at:
          type: string
        expires_at:
          type: string
        access_level:
          type: object
          properties:
            string_value:
              type: string
            integer_value:
              type: string
            custom_role:
              type: string
          required:
          - string_value
          - integer_value
          - custom_role
      required:
      - id
      - source_id
      - source_full_name
      - source_members_url
      - created_at
      - expires_at
      - access_level
      description: API_Entities_BillableMembership model
    putApiV4GroupsIdMembersUserId:
      type: object
      properties:
        access_level:
          type: integer
