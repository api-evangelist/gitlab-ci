openapi: 3.2.0
info:
  title: GitLab access_requests Packages API
  version: v4
  description: Operations related to access requests
servers:
- url: https://gitlab.com
tags:
- name: packages
  description: Operations about packages
paths:
  /api/v4/groups/{id}/-/packages/debian/dists/*distribution/Release.gpg:
    get:
      summary: The Release file signature
      description: This feature was introduced in GitLab 13.5
      parameters:
      - in: path
        name: id
        description: The group ID or full group path.
        required: true
        schema:
          type: string
      - in: query
        name: distribution
        description: The Debian Codename or Suite
        required: true
        example: my-distro
        schema:
          type: string
      responses:
        '200':
          description: The Release file signature
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesDebianDists*distributionReleaseGpg
  /api/v4/groups/{id}/-/packages/debian/dists/*distribution/Release:
    get:
      summary: The unsigned Release file
      description: This feature was introduced in GitLab 13.5
      parameters:
      - in: path
        name: id
        description: The group ID or full group path.
        required: true
        schema:
          type: string
      - in: query
        name: distribution
        description: The Debian Codename or Suite
        required: true
        example: my-distro
        schema:
          type: string
      responses:
        '200':
          description: The unsigned Release file
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesDebianDists*distributionRelease
  /api/v4/groups/{id}/-/packages/debian/dists/*distribution/InRelease:
    get:
      summary: The signed Release file
      description: This feature was introduced in GitLab 13.5
      parameters:
      - in: path
        name: id
        description: The group ID or full group path.
        required: true
        schema:
          type: string
      - in: query
        name: distribution
        description: The Debian Codename or Suite
        required: true
        example: my-distro
        schema:
          type: string
      responses:
        '200':
          description: The signed Release file
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesDebianDists*distributionInrelease
  /api/v4/groups/{id}/-/packages/debian/dists/*distribution/{component}/debian-installer/binary-{architecture}/Packages:
    get:
      summary: The installer (udeb) binary files index
      description: This feature was introduced in GitLab 15.4
      parameters:
      - in: path
        name: id
        description: The group ID or full group path.
        required: true
        schema:
          type: string
      - in: query
        name: distribution
        description: The Debian Codename or Suite
        required: true
        example: my-distro
        schema:
          type: string
      - in: path
        name: component
        description: The Debian Component
        required: true
        example: main
        schema:
          type: string
      - in: path
        name: architecture
        description: The Debian Architecture
        required: true
        example: binary-amd64
        schema:
          type: string
      responses:
        '200':
          description: The installer (udeb) binary files index
        '202':
          description: The installer (udeb) binary files index
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesDebianDists*distributionComponentDebianInstallerBinaryArchitecturePackages
  ? /api/v4/groups/{id}/-/packages/debian/dists/*distribution/{component}/debian-installer/binary-{architecture}/by-hash/SHA256/{file_sha256}
  : get:
      summary: The installer (udeb) binary files index by hash
      description: This feature was introduced in GitLab 15.4
      parameters:
      - in: path
        name: id
        description: The group ID or full group path.
        required: true
        schema:
          type: string
      - in: query
        name: distribution
        description: The Debian Codename or Suite
        required: true
        example: my-distro
        schema:
          type: string
      - in: path
        name: component
        description: The Debian Component
        required: true
        example: main
        schema:
          type: string
      - in: path
        name: architecture
        description: The Debian Architecture
        required: true
        example: binary-amd64
        schema:
          type: string
      - in: path
        name: file_sha256
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The installer (udeb) binary files index by hash
        '202':
          description: The installer (udeb) binary files index by hash
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesDebianDists*distributionComponentDebianInstallerBinaryArchitectureByHashSha256FileSha256
  /api/v4/groups/{id}/-/packages/debian/dists/*distribution/{component}/source/Sources:
    get:
      summary: The source files index
      description: This feature was introduced in GitLab 15.4
      parameters:
      - in: path
        name: id
        description: The group ID or full group path.
        required: true
        schema:
          type: string
      - in: query
        name: distribution
        description: The Debian Codename or Suite
        required: true
        example: my-distro
        schema:
          type: string
      - in: path
        name: component
        description: The Debian Component
        required: true
        example: main
        schema:
          type: string
      responses:
        '200':
          description: The source files index
        '202':
          description: The source files index
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesDebianDists*distributionComponentSourceSources
  /api/v4/groups/{id}/-/packages/debian/dists/*distribution/{component}/source/by-hash/SHA256/{file_sha256}:
    get:
      summary: The source files index by hash
      description: This feature was introduced in GitLab 15.4
      parameters:
      - in: path
        name: id
        description: The group ID or full group path.
        required: true
        schema:
          type: string
      - in: query
        name: distribution
        description: The Debian Codename or Suite
        required: true
        example: my-distro
        schema:
          type: string
      - in: path
        name: component
        description: The Debian Component
        required: true
        example: main
        schema:
          type: string
      - in: path
        name: file_sha256
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The source files index by hash
        '202':
          description: The source files index by hash
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesDebianDists*distributionComponentSourceByHashSha256FileSha256
  /api/v4/groups/{id}/-/packages/debian/dists/*distribution/{component}/binary-{architecture}/Packages:
    get:
      summary: The binary files index
      description: This feature was introduced in GitLab 13.5
      parameters:
      - in: path
        name: id
        description: The group ID or full group path.
        required: true
        schema:
          type: string
      - in: query
        name: distribution
        description: The Debian Codename or Suite
        required: true
        example: my-distro
        schema:
          type: string
      - in: path
        name: component
        description: The Debian Component
        required: true
        example: main
        schema:
          type: string
      - in: path
        name: architecture
        description: The Debian Architecture
        required: true
        example: binary-amd64
        schema:
          type: string
      responses:
        '200':
          description: The binary files index
        '202':
          description: The binary files index
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesDebianDists*distributionComponentBinaryArchitecturePackages
  /api/v4/groups/{id}/-/packages/debian/dists/*distribution/{component}/binary-{architecture}/by-hash/SHA256/{file_sha256}:
    get:
      summary: The binary files index by hash
      description: This feature was introduced in GitLab 15.4
      parameters:
      - in: path
        name: id
        description: The group ID or full group path.
        required: true
        schema:
          type: string
      - in: query
        name: distribution
        description: The Debian Codename or Suite
        required: true
        example: my-distro
        schema:
          type: string
      - in: path
        name: component
        description: The Debian Component
        required: true
        example: main
        schema:
          type: string
      - in: path
        name: architecture
        description: The Debian Architecture
        required: true
        example: binary-amd64
        schema:
          type: string
      - in: path
        name: file_sha256
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The binary files index by hash
        '202':
          description: The binary files index by hash
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesDebianDists*distributionComponentBinaryArchitectureByHashSha256FileSha256
  ? /api/v4/groups/{id}/-/packages/debian/pool/{distribution}/{project_id}/{letter}/{package_name}/{package_version}/{file_name}
  : get:
      summary: Download Debian package
      description: This feature was introduced in GitLab 14.2
      parameters:
      - in: path
        name: id
        description: The group ID or full group path.
        required: true
        schema:
          type: string
      - in: path
        name: project_id
        description: The Project Id
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: distribution
        description: The Debian Codename or Suite
        required: true
        example: my-distro
        schema:
          type: string
      - in: path
        name: letter
        description: The Debian Classification (first-letter or lib-first-letter)
        required: true
        example: a
        schema:
          type: string
      - in: path
        name: package_name
        description: The Debian Source Package Name
        required: true
        example: my-pkg
        schema:
          type: string
      - in: path
        name: package_version
        description: The Debian Source Package Version
        required: true
        example: 1.0.0
        schema:
          type: string
      - in: path
        name: file_name
        description: The Debian File Name
        required: true
        example: example_1.0.0~alpha2_amd64.deb
        schema:
          type: string
      responses:
        '200':
          description: Download Debian package
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesDebianPoolDistributionProjectIdLetterPackageNamePackageVersionFileName
  /api/v4/groups/{id}/-/debian_distributions:
    post:
      summary: Create a Debian Distribution
      description: This feature was introduced in 14.0
      parameters:
      - in: path
        name: id
        description: The ID or URL-encoded path of the group
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Create a Debian Distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Packages_Debian_Distribution'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: postApiV4GroupsIdDebianDistributions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiV4GroupsIdDebianDistributions'
        required: true
    get:
      summary: Get a list of Debian Distributions
      description: This feature was introduced in 14.0
      parameters:
      - in: path
        name: id
        description: The ID or URL-encoded path of the group
        required: true
        schema:
          type: string
      - in: query
        name: page
        description: Current page number
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of items per page
        required: false
        example: 20
        schema:
          type: integer
          format: int32
          default: 20
      - in: query
        name: codename
        description: The Debian Codename
        required: false
        example: sid
        schema:
          type: string
      - in: query
        name: suite
        description: The Debian Suite
        required: false
        example: unstable
        schema:
          type: string
      - in: query
        name: origin
        description: The Debian Origin
        required: false
        example: Grep
        schema:
          type: string
      - in: query
        name: label
        description: The Debian Label
        required: false
        example: grep.be
        schema:
          type: string
      - in: query
        name: version
        description: The Debian Version
        required: false
        example: '12'
        schema:
          type: string
      - in: query
        name: description
        description: The Debian Description
        required: false
        example: My description
        schema:
          type: string
      - in: query
        name: valid_time_duration_seconds
        description: The duration before the Release file should be considered expired by the client
        required: false
        example: 604800
        schema:
          type: integer
          format: int32
      - in: query
        name: components
        description: The list of Components
        required: false
        example: main
        schema:
          type: array
          items:
            type: string
      - in: query
        name: architectures
        description: The list of Architectures
        required: false
        example: amd64
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Get a list of Debian Distributions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Packages_Debian_Distribution'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdDebianDistributions
  /api/v4/groups/{id}/-/debian_distributions/{codename}:
    get:
      summary: Get a Debian Distribution
      description: This feature was introduced in 14.0
      parameters:
      - in: path
        name: id
        description: The ID or URL-encoded path of the group
        required: true
        schema:
          type: string
      - in: path
        name: codename
        description: The Debian Codename
        required: true
        example: sid
        schema:
          type: string
      responses:
        '200':
          description: Get a Debian Distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Packages_Debian_Distribution'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdDebianDistributionsCodename
    put:
      summary: Update a Debian Distribution
      description: This feature was introduced in 14.0
      parameters:
      - in: path
        name: id
        description: The ID or URL-encoded path of the group
        required: true
        schema:
          type: string
      - in: path
        name: codename
        description: The Debian Codename
        required: true
        example: sid
        schema:
          type: string
      responses:
        '200':
          description: Update a Debian Distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Packages_Debian_Distribution'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: putApiV4GroupsIdDebianDistributionsCodename
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putApiV4GroupsIdDebianDistributionsCodename'
        required: true
    delete:
      summary: Delete a Debian Distribution
      description: This feature was introduced in 14.0
      parameters:
      - in: path
        name: id
        description: The ID or URL-encoded path of the group
        required: true
        schema:
          type: string
      - in: path
        name: codename
        description: The Debian Codename
        required: true
        example: sid
        schema:
          type: string
      - in: query
        name: suite
        description: The Debian Suite
        required: false
        example: unstable
        schema:
          type: string
      - in: query
        name: origin
        description: The Debian Origin
        required: false
        example: Grep
        schema:
          type: string
      - in: query
        name: label
        description: The Debian Label
        required: false
        example: grep.be
        schema:
          type: string
      - in: query
        name: version
        description: The Debian Version
        required: false
        example: '12'
        schema:
          type: string
      - in: query
        name: description
        description: The Debian Description
        required: false
        example: My description
        schema:
          type: string
      - in: query
        name: valid_time_duration_seconds
        description: The duration before the Release file should be considered expired by the client
        required: false
        example: 604800
        schema:
          type: integer
          format: int32
      - in: query
        name: components
        description: The list of Components
        required: false
        example: main
        schema:
          type: array
          items:
            type: string
      - in: query
        name: architectures
        description: The list of Architectures
        required: false
        example: amd64
        schema:
          type: array
          items:
            type: string
      responses:
        '202':
          description: Delete a Debian Distribution
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: deleteApiV4GroupsIdDebianDistributionsCodename
  /api/v4/groups/{id}/-/debian_distributions/{codename}/key.asc:
    get:
      summary: Get a Debian Distribution Key
      description: This feature was introduced in 14.4
      parameters:
      - in: path
        name: id
        description: The ID or URL-encoded path of the group
        required: true
        schema:
          type: string
      - in: path
        name: codename
        description: The Debian Codename
        required: true
        example: sid
        schema:
          type: string
      responses:
        '200':
          description: Get a Debian Distribution Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Packages_Debian_Distribution'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdDebianDistributionsCodenameKeyAsc
  /api/v4/groups/{id}/packages:
    get:
      summary: List packages within a group
      description: Get a list of project packages at the group level. This feature was introduced in GitLab 12.5
      parameters:
      - in: path
        name: id
        description: ID or URL-encoded path of the group
        required: true
        schema:
          type: string
      - in: query
        name: exclude_subgroups
        description: Determines if subgroups should be excluded
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: page
        description: Current page number
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of items per page
        required: false
        example: 20
        schema:
          type: integer
          format: int32
          default: 20
      - in: query
        name: order_by
        description: Return packages ordered by `created_at`, `name`, `version` or `type` fields.
        required: false
        schema:
          type: string
          enum:
          - created_at
          - name
          - version
          - type
          - project_path
          default: created_at
      - in: query
        name: sort
        description: Return packages sorted in `asc` or `desc` order.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - in: query
        name: package_type
        description: Return packages of a certain type
        required: false
        schema:
          type: string
          enum:
          - maven
          - npm
          - conan
          - nuget
          - pypi
          - composer
          - generic
          - golang
          - debian
          - rubygems
          - helm
          - terraform_module
          - rpm
          - ml_model
          - cargo
      - in: query
        name: package_name
        description: Return packages with this name
        required: false
        schema:
          type: string
      - in: query
        name: package_version
        description: Return packages with this version
        required: false
        schema:
          type: string
      - in: query
        name: include_versionless
        description: Returns packages without a version
        required: false
        schema:
          type: boolean
      - in: query
        name: status
        description: Return packages with specified status
        required: false
        schema:
          type: string
          enum:
          - default
          - hidden
          - processing
          - error
          - pending_destruction
          - deprecated
      responses:
        '200':
          description: List packages within a group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/API_Entities_Package'
        '401':
          description: Unauthorized
        '404':
          description: Group Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackages
  /api/v4/groups/{id}/-/packages/maven/*path/{file_name}:
    get:
      summary: Download the maven package file at a group level
      description: This feature was introduced in GitLab 11.7
      parameters:
      - in: path
        name: id
        description: The ID or URL-encoded path of the group
        required: true
        schema:
          type: string
      - in: query
        name: path
        description: Package path
        required: true
        example: foo/bar/mypkg/1.0-SNAPSHOT
        schema:
          type: string
      - in: path
        name: file_name
        description: Package file name
        required: true
        example: mypkg-1.0-SNAPSHOT.jar
        schema:
          type: string
      responses:
        '200':
          description: Download the maven package file at a group level
        '302':
          description: Download the maven package file at a group level
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesMaven*pathFileName
  /api/v4/groups/{id}/-/packages/npm/-/package/*package_name/dist-tags:
    get:
      summary: Get all tags for a given an NPM package
      description: This feature was introduced in GitLab 12.7
      parameters:
      - in: path
        name: id
        description: The ID or URL-encoded path of the group
        required: true
        schema:
          type: string
      - in: query
        name: package_name
        description: Package name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Get all tags for a given an NPM package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_NpmPackageTag'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - packages
      operationId: getApiV4GroupsIdPackagesNpmPackage*packageNameDistTags
  /api/v4/groups/{id}/-/packages/npm/-/package/*package_name/dist-tags/{tag}:
    put:
      summary: Create or Update the given tag for the given NPM package and version
      description: This feature was introduced in GitLab 12.7
      parameters:
      - in: path
        name: id
        description: The ID or URL-encoded path of the group
        required: true
        schema:
          type: string
      - in: path
        name: tag
        description: Package dist-tag
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Create or Update the given tag for the given NPM package and version
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
