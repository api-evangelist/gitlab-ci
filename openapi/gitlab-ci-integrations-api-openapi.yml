        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: List all active integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/API_Entities_IntegrationBasic'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      tags:
      - integrations
      operationId: getApiV4GroupsIdIntegrations
