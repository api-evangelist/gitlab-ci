        type: integer
        format: int32
        required: true
        example: 13
      responses:
        '200':
          description: Get a single pipeline schedule
          schema:
            $ref: '#/definitions/API_Entities_Ci_PipelineScheduleDetails'
        '401':
          description: Unauthorized
        '403':
