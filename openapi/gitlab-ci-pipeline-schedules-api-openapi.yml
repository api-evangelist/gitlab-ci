        example: Test schedule pipeline
      ref:
        type: string
        description: The branch/tag name will be triggered
        example: develop
      cron:
        type: string
        description: The cron
        example: '* * * * *'
      cron_timezone:
        type: string
        description: The timezone
        default: UTC
        example: Asia/Tokyo
      active:
        type: boolean
        description: The activation of pipeline schedule
        default: true
        example: true
      inputs:
        type: array
        description: Inputs for the pipeline schedule
        example:
        - name: array_input
          value:
          - 1
          - 2
        - name: boolean_input
          value: true
        items:
          type: object
          properties:
            name:
              type: string
              description: The name of the input
              example: deploy_strategy
            value:
              type: string
              description: The value of the input
              example: blue-green
          required:
          - name
          - value
    required:
    - description
    - ref
    - cron
    description: Create a new pipeline schedule
  API_Entities_CustomAttribute:
    type: object
    properties:
      key:
        type: string
        example: foo
      value:
        type: string
        example: bar
    required:
    - key
    - value
    description: API_Entities_CustomAttribute model
  putApiV4ProjectsIdPipelineSchedulesPipelineScheduleId:
