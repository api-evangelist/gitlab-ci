swagger: '2.0'
info:
  title: GitLab access_requests pipeline_schedules API
  version: v4
  description: Operations related to access requests
host: gitlab.com
produces:
- application/json
tags:
- name: pipeline_schedules
  description: Operations about pipeline_schedules
paths:
  /api/v4/projects/{id}/pipeline_schedules:
    get:
      description: Get all pipeline schedules
      produces:
      - application/json
      parameters:
      - in: path
        name: id
        description: The ID or URL-encoded path of the project
        type: string
        required: true
        example: 18
      - in: query
        name: page
        description: Current page number
        type: integer
        format: int32
        default: 1
        required: false
        example: 1
      - in: query
        name: per_page
        description: Number of items per page
        type: integer
        format: int32
        default: 20
        required: false
        example: 20
      - in: query
        name: scope
        description: The scope of pipeline schedules
        type: string
        enum:
        - active
        - inactive
        required: false
        example: active
      responses:
        '200':
          description: Get all pipeline schedules
          schema:
            type: array
            items:
              $ref: '#/definitions/API_Entities_Ci_PipelineSchedule'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipeline_schedules
      operationId: getApiV4ProjectsIdPipelineSchedules
    post:
      description: Create a new pipeline schedule
      produces:
      - application/json
      consumes:
      - application/json
      parameters:
      - in: path
        name: id
        description: The ID or URL-encoded path of the project
        type: string
        required: true
        example: 18
      - name: postApiV4ProjectsIdPipelineSchedules
        in: body
        required: true
        schema:
          $ref: '#/definitions/postApiV4ProjectsIdPipelineSchedules'
      responses:
        '201':
          description: Create a new pipeline schedule
          schema:
            $ref: '#/definitions/API_Entities_Ci_PipelineScheduleDetails'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipeline_schedules
      operationId: postApiV4ProjectsIdPipelineSchedules
  /api/v4/projects/{id}/pipeline_schedules/{pipeline_schedule_id}:
