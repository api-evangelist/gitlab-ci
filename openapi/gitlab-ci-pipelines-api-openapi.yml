swagger: '2.0'
info:
  title: GitLab access_requests pipelines API
  version: v4
  description: Operations related to access requests
host: gitlab.com
produces:
- application/json
tags:
- name: pipelines
  description: Operations about pipelines
paths:
  /api/v4/projects/{id}/pipelines:
    get:
      summary: Get all Pipelines of the project
      description: This feature was introduced in GitLab 8.11.
      produces:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: query
        name: page
        description: Current page number
        type: integer
        format: int32
        default: 1
        required: false
        example: 1
      - in: query
        name: per_page
        description: Number of items per page
        type: integer
        format: int32
        default: 20
        required: false
        example: 20
      - in: query
        name: scope
        description: The scope of pipelines
        type: string
        enum:
        - running
        - pending
        - finished
        - branches
        - tags
        required: false
        example: pending
      - in: query
        name: status
        description: The status of pipelines
        type: string
        enum:
        - created
        - waiting_for_resource
        - preparing
        - waiting_for_callback
        - pending
        - running
        - success
        - failed
        - canceling
        - canceled
        - skipped
        - manual
        - scheduled
        required: false
        example: pending
      - in: query
        name: ref
        description: The ref of pipelines
        type: string
        required: false
        example: develop
      - in: query
        name: sha
        description: The sha of pipelines
        type: string
        required: false
        example: a91957a858320c0e17f3a0eca7cfacbff50ea29a
      - in: query
        name: yaml_errors
        description: Returns pipelines with invalid configurations
        type: boolean
        required: false
      - in: query
        name: username
        description: The username of the user who triggered pipelines
        type: string
        required: false
        example: root
      - in: query
        name: updated_before
        description: 'Return pipelines updated before the specified datetime. Format: ISO 8601 YYYY-MM-DDTHH:MM:SSZ'
        type: string
        format: date-time
        required: false
        example: '2015-12-24T15:51:21.880Z'
      - in: query
        name: updated_after
        description: 'Return pipelines updated after the specified datetime. Format: ISO 8601 YYYY-MM-DDTHH:MM:SSZ'
        type: string
        format: date-time
        required: false
        example: '2015-12-24T15:51:21.880Z'
      - in: query
        name: created_before
        description: 'Return pipelines created before the specified datetime. Format: ISO 8601 YYYY-MM-DDTHH:MM:SSZ'
        type: string
        format: date-time
        required: false
        example: '2015-12-24T15:51:21.880Z'
      - in: query
        name: created_after
        description: 'Return pipelines created after the specified datetime. Format: ISO 8601 YYYY-MM-DDTHH:MM:SSZ'
        type: string
        format: date-time
        required: false
        example: '2015-12-24T15:51:21.880Z'
      - in: query
        name: order_by
        description: Order pipelines
        type: string
        default: id
        enum:
        - id
        - status
        - ref
        - updated_at
        - user_id
        required: false
        example: status
      - in: query
        name: sort
        description: Sort pipelines
        type: string
        default: desc
        enum:
        - asc
        - desc
        required: false
        example: asc
      - in: query
        name: source
        description: The source of pipelines
        type: string
        enum:
        - unknown
        - push
        - web
        - trigger
        - schedule
        - api
        - external
        - pipeline
        - chat
        - webide
        - merge_request_event
        - external_pull_request_event
        - parent_pipeline
        - ondemand_dast_scan
        - ondemand_dast_validation
        - security_orchestration_policy
        - container_registry_push
        - duo_workflow
        - pipeline_execution_policy_schedule
        - dependency_management_security_update
        required: false
        example: push
      - in: query
        name: name
        description: Filter pipelines by name
        type: string
        required: false
        example: Build pipeline
      responses:
        '200':
          description: Get all Pipelines of the project
          schema:
            type: array
            items:
              $ref: '#/definitions/API_Entities_Ci_PipelineBasic'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      tags:
      - pipelines
      operationId: getApiV4ProjectsIdPipelines
  /api/v4/projects/{id}/pipeline:
    post:
      summary: Create a new pipeline
      description: This feature was introduced in GitLab 8.14
      produces:
      - application/json
      consumes:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - name: postApiV4ProjectsIdPipeline
        in: body
        required: true
        schema:
          $ref: '#/definitions/postApiV4ProjectsIdPipeline'
      responses:
        '201':
          description: Create a new pipeline
          schema:
            $ref: '#/definitions/API_Entities_Ci_Pipeline'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipelines
      operationId: postApiV4ProjectsIdPipeline
  /api/v4/projects/{id}/pipelines/latest:
    get:
      summary: Gets the latest pipeline for the project branch
      description: This feature was introduced in GitLab 12.3
      produces:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: query
        name: ref
        description: Branch ref of pipeline. Uses project default branch if not specified.
        type: string
        required: false
        example: develop
      responses:
        '200':
          description: Gets the latest pipeline for the project branch
          schema:
            $ref: '#/definitions/API_Entities_Ci_PipelineWithMetadata'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipelines
      operationId: getApiV4ProjectsIdPipelinesLatest
  /api/v4/projects/{id}/pipelines/{pipeline_id}:
    get:
      summary: Gets a specific pipeline for the project
      description: This feature was introduced in GitLab 8.11
      produces:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: path
        name: pipeline_id
        description: The pipeline ID
        type: integer
        format: int32
        required: true
        example: 18
      responses:
        '200':
          description: Gets a specific pipeline for the project
          schema:
            $ref: '#/definitions/API_Entities_Ci_PipelineWithMetadata'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipelines
      operationId: getApiV4ProjectsIdPipelinesPipelineId
    delete:
      summary: Deletes a pipeline
      description: This feature was introduced in GitLab 11.6
      produces:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: path
        name: pipeline_id
        description: The pipeline ID
        type: integer
        format: int32
        required: true
        example: 18
      responses:
        '204':
          description: Pipeline was deleted
        '403':
          description: Forbidden
      tags:
      - pipelines
      operationId: deleteApiV4ProjectsIdPipelinesPipelineId
  /api/v4/projects/{id}/pipelines/{pipeline_id}/jobs:
    get:
      description: Get pipeline jobs
      produces:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: path
        name: pipeline_id
        description: The pipeline ID
        type: integer
        format: int32
        required: true
        example: 18
      - in: query
        name: include_retried
        description: Includes retried jobs
        type: boolean
        default: false
        required: false
      - in: query
        name: scope
        description: The scope of builds to show
        type: string
        enum:
        - created
        - waiting_for_resource
        - preparing
        - waiting_for_callback
        - pending
        - running
        - success
        - failed
        - canceling
        - canceled
        - skipped
        - manual
        - scheduled
        required: false
        example:
        - pending
        - running
      - in: query
        name: page
        description: Current page number
        type: integer
        format: int32
        default: 1
        required: false
        example: 1
      - in: query
        name: per_page
        description: Number of items per page
        type: integer
        format: int32
        default: 20
        required: false
        example: 20
      responses:
        '200':
          description: Get pipeline jobs
          schema:
            type: array
            items:
              $ref: '#/definitions/API_Entities_Ci_Job'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipelines
      operationId: getApiV4ProjectsIdPipelinesPipelineIdJobs
  /api/v4/projects/{id}/pipelines/{pipeline_id}/bridges:
    get:
      description: Get pipeline bridge jobs
      produces:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: path
        name: pipeline_id
        description: The pipeline ID
        type: integer
        format: int32
        required: true
        example: 18
      - in: query
        name: scope
        description: The scope of builds to show
        type: string
        enum:
        - created
        - waiting_for_resource
        - preparing
        - waiting_for_callback
        - pending
        - running
        - success
        - failed
        - canceling
        - canceled
        - skipped
        - manual
        - scheduled
        required: false
        example:
        - pending
        - running
      - in: query
        name: page
        description: Current page number
        type: integer
        format: int32
        default: 1
        required: false
        example: 1
      - in: query
        name: per_page
        description: Number of items per page
        type: integer
        format: int32
        default: 20
        required: false
        example: 20
      responses:
        '200':
          description: Get pipeline bridge jobs
          schema:
            type: array
            items:
              $ref: '#/definitions/API_Entities_Ci_Bridge'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipelines
      operationId: getApiV4ProjectsIdPipelinesPipelineIdBridges
  /api/v4/projects/{id}/pipelines/{pipeline_id}/variables:
    get:
      summary: Gets the variables for a given pipeline
      description: This feature was introduced in GitLab 11.11
      produces:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: path
        name: pipeline_id
        description: The pipeline ID
        type: integer
        format: int32
        required: true
        example: 18
      responses:
        '200':
          description: Gets the variables for a given pipeline
          schema:
            type: array
            items:
              $ref: '#/definitions/API_Entities_Ci_Variable'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipelines
      operationId: getApiV4ProjectsIdPipelinesPipelineIdVariables
  /api/v4/projects/{id}/pipelines/{pipeline_id}/test_report:
    get:
      summary: Gets the test report for a given pipeline
      description: This feature was introduced in GitLab 13.0.
      produces:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: path
        name: pipeline_id
        description: The pipeline ID
        type: integer
        format: int32
        required: true
        example: 18
      responses:
        '200':
          description: Gets the test report for a given pipeline
          schema:
            $ref: '#/definitions/TestReportEntity'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipelines
      operationId: getApiV4ProjectsIdPipelinesPipelineIdTestReport
  /api/v4/projects/{id}/pipelines/{pipeline_id}/test_report_summary:
    get:
      summary: Gets the test report summary for a given pipeline
      description: This feature was introduced in GitLab 14.2
      produces:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: path
        name: pipeline_id
        description: The pipeline ID
        type: integer
        format: int32
        required: true
        example: 18
      responses:
        '200':
          description: Gets the test report summary for a given pipeline
          schema:
            $ref: '#/definitions/TestReportSummaryEntity'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipelines
      operationId: getApiV4ProjectsIdPipelinesPipelineIdTestReportSummary
  /api/v4/projects/{id}/pipelines/{pipeline_id}/metadata:
    put:
      summary: Updates pipeline metadata
      description: This feature was introduced in GitLab 16.6
      produces:
      - application/json
      consumes:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: path
        name: pipeline_id
        description: The pipeline ID
        type: integer
        format: int32
        required: true
        example: 18
      - name: putApiV4ProjectsIdPipelinesPipelineIdMetadata
        in: body
        required: true
        schema:
          $ref: '#/definitions/putApiV4ProjectsIdPipelinesPipelineIdMetadata'
      responses:
        '200':
          description: Updates pipeline metadata
          schema:
            $ref: '#/definitions/API_Entities_Ci_PipelineWithMetadata'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipelines
      operationId: putApiV4ProjectsIdPipelinesPipelineIdMetadata
  /api/v4/projects/{id}/pipelines/{pipeline_id}/retry:
    post:
      summary: Retry builds in the pipeline
      description: This feature was introduced in GitLab 8.11.
      produces:
      - application/json
      consumes:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: path
        name: pipeline_id
        description: The pipeline ID
        type: integer
        format: int32
        required: true
        example: 18
      responses:
        '201':
          description: Retry builds in the pipeline
          schema:
            $ref: '#/definitions/API_Entities_Ci_Pipeline'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipelines
      operationId: postApiV4ProjectsIdPipelinesPipelineIdRetry
  /api/v4/projects/{id}/pipelines/{pipeline_id}/cancel:
    post:
      summary: Cancel all builds in the pipeline
      description: This feature was introduced in GitLab 8.11.
      produces:
      - application/json
      consumes:
      - application/json
      parameters:
      - in: path
        name: id
        description: The project ID or URL-encoded path
        type: string
        required: true
        example: 11
      - in: path
        name: pipeline_id
        description: The pipeline ID
        type: integer
        format: int32
        required: true
        example: 18
      responses:
        '201':
          description: Cancel all builds in the pipeline
          schema:
            $ref: '#/definitions/API_Entities_Ci_Pipeline'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      tags:
      - pipelines
      operationId: postApiV4ProjectsIdPipelinesPipelineIdCancel
definitions:
  API_Entities_CustomAttribute:
    type: object
    properties:
      key:
        type: string
        example: foo
      value:
        type: string
        example: bar
    required:
    - key
    - value
    description: API_Entities_CustomAttribute model
  API_Entities_Ci_Runner:
    type: object
    properties:
      id:
        type: integer
        format: int32
        example: 8
      description:
        type: string
        example: test-1-20150125
      ip_address:
        type: string
        example: 127.0.0.1
      active:
        type: boolean
        example: true
      paused:
        type: boolean
        example: false
      is_shared:
        type: boolean
        example: true
      runner_type:
        type: string
        enum:
        - instance_type
        - group_type
        - project_type
        example: instance_type
      name:
        type: string
        example: test
      online:
        type: boolean
        example: true
      created_by:
        $ref: '#/definitions/API_Entities_UserBasic'
      created_at:
        type: string
        format: date-time
        example: '2025-05-03T00:00:00.000Z'
      status:
        type: string
        example: online
      job_execution_status:
        type: string
        enum:
        - active
        - idle
        example: idle
    required:
    - id
    - description
    - ip_address
    - active
    - paused
    - is_shared
    - runner_type
    - name
    - online
    - created_at
    - status
    - job_execution_status
    description: API_Entities_Ci_Runner model
  API_Entities_Ci_RunnerManager:
    type: object
    properties:
      id:
        type: integer
        format: int32
        example: 8
      system_id:
        type: string
        example: runner-1
      version:
        type: string
        example: 16.11.0
      revision:
        type: string
        example: 91a27b2a
      platform:
        type: string
        example: linux
      architecture:
        type: string
        example: amd64
      created_at:
        type: string
        example: '2023-10-24T01:27:06.549Z'
      contacted_at:
        type: string
        example: '2023-10-24T01:27:06.549Z'
      ip_address:
        type: string
        example: 127.0.0.1
      status:
        type: string
        example: online
      job_execution_status:
        type: string
        enum:
        - active
        - idle
        example: idle
    required:
    - id
    - system_id
    - version
    - revision
    - platform
    - architecture
    - created_at
    - contacted_at
    - ip_address
    - status
    - job_execution_status
    description: API_Entities_Ci_RunnerManager model
  API_Entities_UserBasic:
    type: object
    properties:
      id:
        type: integer
        format: int32
        example: 1
      username:
        type: string
        example: admin
      public_email:
        type: string
        example: john@example.com
      name:
        type: string
        example: Administrator
      state:
        type: string
        example: active
      locked:
        type: boolean
      avatar_url:
        type: string
        example: https://gravatar.com/avatar/1
      avatar_path:
        type: string
        example: /user/avatar/28/The-Big-Lebowski-400-400.png
      custom_attributes:
        type: array
        items:
          $ref: '#/definitions/API_Entities_CustomAttribute'
      web_url:
        type: string
        example: https://gitlab.example.com/root
    required:
    - id
    - username
    - public_email
    - name
    - state
    - locked
    - avatar_url
    - web_url
    description: API_Entities_UserBasic model
  API_Entities_User:
    type: object
    properties:
      id:
        type: integer
        format: int32
        example: 1
      username:
        type: string
        example: admin
      public_email:
        type: string
        example: john@example.com
      name:
        type: string
        example: Administrator
      state:
        type: string
        example: active
      locked:
        type: boolean
      avatar_url:
        type: string
        example: https://gravatar.com/avatar/1
      avatar_path:
        type: string
        example: /user/avatar/28/The-Big-Lebowski-400-400.png
      custom_attributes:
        type: array
        items:
          $ref: '#/definitions/API_Entities_CustomAttribute'
      web_url:
        type: string
        example: https://gitlab.example.com/root
      created_at:
        type: string
      bio:
        type: string
      location:
        type: string
      linkedin:
        type: string
      twitter:
        type: string
      discord:
        type: string
      website_url:
        type: string
      github:
        type: string
