openapi: 3.2.0
info:
  title: GitLab Project Snapshots API
  version: v4
  description: Operations about project_snapshots
servers:
- url: https://gitlab.com
tags:
- name: Project Snapshots
  description: Operations about project_snapshots
paths:
  /api/v4/projects/{id}/snapshot:
    get:
      summary: Download a (possibly inconsistent) snapshot of a repository
      description: This feature was introduced in GitLab 10.7
      parameters:
      - in: query
        name: wiki
        description: Set to true to receive the wiki repository
        required: false
        schema:
          type: boolean
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Download a (possibly inconsistent) snapshot of a repository
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
      tags:
      - Project Snapshots
      operationId: getApiV4ProjectsIdSnapshot
components:
  securitySchemes:
    access_token_header:
      type: apiKey
      name: PRIVATE-TOKEN
      in: header
    access_token_query:
      type: apiKey
      name: private_token
      in: query
