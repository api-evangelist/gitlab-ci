        required: false
        schema:
          type: boolean
      - in: query
        name: archived
        description: Limit by archived status
        required: false
        schema:
          type: boolean
      - in: query
        name: visibility
        description: Limit by visibility
        required: false
        schema:
          type: string
          enum:
          - private
          - internal
          - public
      - in: query
        name: search
        description: Return list of authorized projects matching the search criteria
        required: false
        schema:
          type: string
      - in: query
        name: order_by
        description: Return projects ordered by field
        required: false
        schema:
          type: string
          enum:
          - id
          - name
          - path
          - created_at
          - updated_at
          - last_activity_at
          - similarity
          - star_count
          default: created_at
      - in: query
        name: sort
        description: Return projects sorted in ascending and descending order
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - in: query
        name: simple
        description: Return only the ID, URL, name, and path of each project
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: owned
        description: Limit by owned by authenticated user
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: starred
        description: Limit by starred status
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: with_issues_enabled
        description: Limit by enabled issues feature
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: with_merge_requests_enabled
        description: Limit by enabled merge requests feature
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: with_shared
        description: Include projects shared to this group
        required: false
        schema:
          type: boolean
          default: true
      - in: query
        name: include_subgroups
        description: Includes projects in subgroups of this group
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: include_ancestor_groups
        description: Includes projects in ancestors of this group
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: min_access_level
        description: Limit by minimum access level of authenticated user on projects
        required: false
        schema:
          type: integer
          format: int32
          enum:
          - 10
          - 15
          - 20
          - 30
          - 40
          - 50
      - in: query
        name: page
        description: Current page number
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
