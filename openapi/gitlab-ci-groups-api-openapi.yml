                type: object
                properties:
                  access_level:
                    type: integer
                    format: int32
                    description: A valid access level
                    enum:
                    - 30
                    - 40
                    - 60
                    - 0
                required:
                - access_level
            allow_force_push:
              type: boolean
              description: Allow force push for all users with push access.
            allowed_to_merge:
              type: array
              description: An array of access levels allowed to merge
              items:
                type: object
                properties:
                  access_level:
                    type: integer
                    format: int32
                    description: A valid access level
                    enum:
                    - 30
                    - 40
                    - 60
                    - 0
                required:
                - access_level
            code_owner_approval_required:
              type: boolean
              description: Require approval from code owners
            developer_can_initial_push:
              type: boolean
              description: Allow developers to initial push
