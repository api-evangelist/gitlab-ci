openapi: 3.2.0
info:
  title: GitLab access_requests Groups API
  version: v4
  description: Operations related to access requests
servers:
- url: https://gitlab.com
tags:
- name: groups
  description: Operations about groups
paths:
  /api/v4/groups:
    get:
      description: Get a groups list
      parameters:
      - in: query
        name: statistics
        description: Include project statistics
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: archived
        description: Limit by archived status
        required: false
        schema:
          type: boolean
      - in: query
        name: skip_groups
        description: Array of group ids to exclude from list
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: all_available
        description: When `true`, returns all accessible groups. When `false`, returns only groups where the user is a member.
        required: false
        schema:
          type: boolean
      - in: query
        name: visibility
        description: Limit by visibility
        required: false
        schema:
          type: string
          enum:
          - private
          - internal
          - public
      - in: query
        name: search
        description: Search for a specific group
        required: false
        schema:
          type: string
      - in: query
        name: owned
        description: Limit by owned by authenticated user
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: order_by
        description: Order by name, path, id or similarity if searching
        required: false
        schema:
          type: string
          enum:
          - name
          - path
          - id
          - similarity
          default: name
      - in: query
        name: sort
        description: Sort by asc (ascending) or desc (descending)
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - in: query
        name: min_access_level
        description: Minimum access level of authenticated user
        required: false
        schema:
          type: integer
          format: int32
          enum:
          - 10
          - 15
          - 20
          - 30
          - 40
          - 50
      - in: query
        name: top_level_only
        description: Only include top-level groups
        required: false
        schema:
          type: boolean
      - in: query
        name: marked_for_deletion_on
        description: Return groups that are marked for deletion on this date
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: active
        description: Limit by groups that are not archived and not marked for deletion
        required: false
        schema:
          type: boolean
      - in: query
        name: repository_storage
        description: Filter by repository storage used by the group
        required: false
        schema:
          type: string
      - in: query
        name: page
        description: Current page number
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of items per page
        required: false
        example: 20
        schema:
          type: integer
          format: int32
          default: 20
      - in: query
        name: with_custom_attributes
        description: Include custom attributes in the response
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Get a groups list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/API_Entities_Group'
      tags:
      - groups
      operationId: getApiV4Groups
    post:
      description: Create a group. Available only for users who can create groups.
      responses:
        '201':
          description: Create a group. Available only for users who can create groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Group'
      tags:
      - groups
      operationId: postApiV4Groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiV4Groups'
        required: true
  /api/v4/groups/{id}:
    put:
      description: Update a group. Available only for users who can administrate groups.
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Update a group. Available only for users who can administrate groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Group'
      tags:
      - groups
      operationId: putApiV4GroupsId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putApiV4GroupsId'
        required: true
    get:
      description: Get a single group, with containing projects.
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      - in: query
        name: with_custom_attributes
        description: Include custom attributes in the response
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: with_projects
        description: Omit project details
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Get a single group, with containing projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_GroupDetail'
      tags:
      - groups
      operationId: getApiV4GroupsId
    delete:
      description: Remove a group.
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Remove a group.
      tags:
      - groups
      operationId: deleteApiV4GroupsId
  /api/v4/groups/{id}/archive:
    post:
      description: Archive a group
      parameters:
      - in: path
        name: id
        description: The ID of a group
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Archive a group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Entities_Group'
        '403':
          description: Unauthenticated
      tags:
      - groups
      operationId: postApiV4GroupsIdArchive
  /api/v4/groups/{id}/unarchive:
