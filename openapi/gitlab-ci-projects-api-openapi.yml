definitions:
  API_Entities_Terraform_StateProtectionRule:
    type: object
    properties:
      id:
        type: integer
        format: int32
        example: 1
      project_id:
        type: integer
        format: int32
        example: 1
      state_name:
        type: string
        example: production
      minimum_access_level_for_write:
        type: string
        example: maintainer
      allowed_from:
        type: string
        example: ci_only
    required:
    - id
    - project_id
    - state_name
    - minimum_access_level_for_write
    - allowed_from
    description: API_Entities_Terraform_StateProtectionRule model
  API_Entities_CustomAttribute:
    type: object
    properties:
      key:
        type: string
        example: foo
      value:
        type: string
        example: bar
    required:
    - key
    - value
    description: API_Entities_CustomAttribute model
  postApiV4ProjectsIdPackagesProtectionRules:
    type: object
    properties:
      package_name_pattern:
        type: string
        description: "Package name protected by the rule. For example @my-scope/my-package-*.\n            Wildcard character * allowed."
      package_type:
        type: string
        description: Package type protected by the rule. For example npm.
        enum:
        - cargo
        - conan
        - generic
        - helm
        - maven
        - npm
        - nuget
        - pypi
        - terraform_module
      minimum_access_level_for_delete:
        type: string
        description: Minimum GitLab access level required to delete a package. Valid values include `null`, `owner` or `admin`. If the value is `null`, the default minimum access level is `maintainer`. Must be provided when `minimum_access_level_for_push` is not set. Behind a feature flag named `packages_protected_packages_delete`. Disabled by default.
        enum:
        - owner
        - admin
      minimum_access_level_for_push:
        type: string
        description: Minimum GitLab access level required to push a package. Valid values include `null`, `maintainer`, `owner` or `admin`. If the value is `null`, the default minimum access level is `developer`. Must be provided when `minimum_access_level_for_delete` is not set.
        enum:
        - maintainer
        - owner
        - admin
    required:
    - package_name_pattern
    - package_type
    description: Create a package protection rule for a project
  API_Entities_Iteration:
    type: object
    properties:
      id:
        type: integer
        format: int32
        example: 1
      iid:
        type: integer
        format: int32
        example: 1
      sequence:
        type: integer
        format: int32
        example: 1
      group_id:
        type: integer
        format: int32
        example: 1
      title:
        type: string
        example: Iteration I
      description:
        type: string
        example: Iteration description
      state:
        type: integer
        format: int32
        example: 1
      created_at:
        type: string
        format: date-time
        example: '2022-01-31T15:10:45.080Z'
      updated_at:
        type: string
        format: date-time
        example: '2022-01-31T15:10:45.080Z'
      start_date:
        type: string
        format: date
